<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>VINA Dashboard V4</title>
<meta name="description" content="V4 of the VINA Dashboard for iCaur Alghanim: new logo, WhatsApp and web chat for sales, calmer layout. All 49 screens, light and dark.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* VINA Dashboard V2 · "Showroom calm": navy brand frame, layered surfaces instead of outlines, Montserrat (Gotham stand-in) for headings and numbers, Inter for UI. Teal marks anything VINA did. */
:root{
  --navy:#202253; --horizon:#5E97CE; --aqua:#6EBEB9;
  --bg:#F5F6FB; --card:#FFFFFF; --sub:#F0F2F8; --sub2:#E9ECF4; --line:#E5E8F1; --line2:#CDD2E1;
  --text:#161A3D; --mute:#596082; --faint:#6E7495; --nav-bd:transparent; --card-hi:none; --pri:#202253; --on-pri:#FFFFFF; --pri-h:#2D317A;
  --link:#2C68A6; --sel:#EAF2FB; --inp:#FFFFFF; --ring:rgba(94,151,206,.35);
  --nav:#1D1F4E; --nav2:#24276A; --nav-t:rgba(255,255,255,.72); --nav-a:rgba(255,255,255,.12); --nav-h:rgba(255,255,255,.07); --nav-line:rgba(255,255,255,.1);
  --dim:rgba(16,18,46,.42);
  --e1:0 1px 2px rgba(22,26,61,.05),0 1px 3px rgba(22,26,61,.04);
  --e2:0 6px 16px -4px rgba(22,26,61,.10),0 2px 4px rgba(22,26,61,.04);
  --e3:0 24px 48px -12px rgba(22,26,61,.22),0 4px 12px rgba(22,26,61,.06);
  --card-bd:transparent;
  --blue-b:#EAF2FB; --blue-f:#2C68A6; --teal-b:#E2F3F1; --teal-f:#17675F; --amber-b:#FFF3DD; --amber-f:#8A5300;
  --navy-b:#E5E6F3; --navy-f:#202253; --purple-b:#EFEBFB; --purple-f:#5B3FB5; --indigo-b:#E7E8F7; --indigo-f:#3B3F8F;
  --green-b:#E4F5EB; --green-f:#16714A; --grey-b:#EDEFF5; --grey-f:#4A5070; --red-b:#FDEBE9; --red-f:#B42318; --red:#D92D20; --amber:#F2A93B; --green:#12B76A;
  --ch-a:#5E97CE; --ch-b:#6EBEB9; --ch-c:#202253; --ch-d:#C3C9DD; --ch-e:#9B83DE; --ch-f:#E0A34B;
  --logo-ink:#202253;
  --f:Inter,'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-display:Montserrat,Inter,'IBM Plex Sans Arabic',system-ui,sans-serif;
  --f-ar:'IBM Plex Sans Arabic',Inter,system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1); --ease-in:cubic-bezier(.4,0,1,1); --spring:cubic-bezier(.34,1.4,.64,1);
  --d1:120ms; --d2:200ms; --d3:320ms; --d4:520ms;
  --r-s:8px; --r-m:12px; --r-l:16px; --r-xl:20px;
  --shadow:var(--e3); --shadow-s:var(--e1); /* V1 names, kept for modules */
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0D1E; --card:#14172E; --sub:#1B1F3B; --sub2:#222746; --line:#262B4E; --line2:#363C68;
  --text:#E9EBF6; --mute:#A4A9C8; --faint:#9096BA; --nav-bd:#1C2040; --card-hi:inset 0 1px 0 rgba(255,255,255,.035); --pri:#6FA3D8; --on-pri:#0A0C1C; --pri-h:#8AB5E2;
  --link:#93BBE8; --sel:rgba(94,151,206,.15); --inp:#101329; --ring:rgba(111,163,216,.45);
  --nav:#090A19; --nav2:#0E1024; --nav-t:rgba(255,255,255,.68); --nav-a:rgba(111,163,216,.18); --nav-h:rgba(255,255,255,.05); --nav-line:rgba(255,255,255,.07);
  --dim:rgba(0,0,0,.6);
  --e1:0 1px 2px rgba(0,0,0,.4); --e2:0 8px 20px -6px rgba(0,0,0,.55); --e3:0 28px 56px -12px rgba(0,0,0,.7);
  --card-bd:#232848;
  --blue-b:rgba(94,151,206,.16); --blue-f:#93BBE8; --teal-b:rgba(110,190,185,.15); --teal-f:#80D4CD; --amber-b:rgba(242,184,75,.14); --amber-f:#F3C46E;
  --navy-b:rgba(195,201,240,.12); --navy-f:#CBD0F3; --purple-b:rgba(185,166,245,.14); --purple-f:#C6B7F8; --indigo-b:rgba(150,156,240,.14); --indigo-f:#B6BAF6;
  --green-b:rgba(111,211,160,.13); --green-f:#80DAA9; --grey-b:rgba(181,186,211,.11); --grey-f:#B7BCD5; --red-b:rgba(242,139,130,.14); --red-f:#F59C94; --red:#F04438; --amber:#F2B84B; --green:#32D583;
  --ch-a:#6FA3D8; --ch-b:#6EBEB9; --ch-c:#A9B4E8; --ch-d:#363C68; --ch-e:#B9A3F0; --ch-f:#E8B465;
  --logo-ink:#FFFFFF; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0B0D1E; --card:#14172E; --sub:#1B1F3B; --sub2:#222746; --line:#262B4E; --line2:#363C68;
  --text:#E9EBF6; --mute:#A4A9C8; --faint:#9096BA; --nav-bd:#1C2040; --card-hi:inset 0 1px 0 rgba(255,255,255,.035); --pri:#6FA3D8; --on-pri:#0A0C1C; --pri-h:#8AB5E2;
  --link:#93BBE8; --sel:rgba(94,151,206,.15); --inp:#101329; --ring:rgba(111,163,216,.45);
  --nav:#090A19; --nav2:#0E1024; --nav-t:rgba(255,255,255,.68); --nav-a:rgba(111,163,216,.18); --nav-h:rgba(255,255,255,.05); --nav-line:rgba(255,255,255,.07);
  --dim:rgba(0,0,0,.6);
  --e1:0 1px 2px rgba(0,0,0,.4); --e2:0 8px 20px -6px rgba(0,0,0,.55); --e3:0 28px 56px -12px rgba(0,0,0,.7);
  --card-bd:#232848;
  --blue-b:rgba(94,151,206,.16); --blue-f:#93BBE8; --teal-b:rgba(110,190,185,.15); --teal-f:#80D4CD; --amber-b:rgba(242,184,75,.14); --amber-f:#F3C46E;
  --navy-b:rgba(195,201,240,.12); --navy-f:#CBD0F3; --purple-b:rgba(185,166,245,.14); --purple-f:#C6B7F8; --indigo-b:rgba(150,156,240,.14); --indigo-f:#B6BAF6;
  --green-b:rgba(111,211,160,.13); --green-f:#80DAA9; --grey-b:rgba(181,186,211,.11); --grey-f:#B7BCD5; --red-b:rgba(242,139,130,.14); --red-f:#F59C94; --red:#F04438; --amber:#F2B84B; --green:#32D583;
  --ch-a:#6FA3D8; --ch-b:#6EBEB9; --ch-c:#A9B4E8; --ch-d:#363C68; --ch-e:#B9A3F0; --ch-f:#E8B465;
  --logo-ink:#FFFFFF; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--bg);color:var(--text)}
body{margin:0;font-family:var(--f);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--link);text-underline-offset:2px}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-family:var(--f-display);letter-spacing:-.01em}
p{margin:0}
::selection{background:var(--ring)}
[dir="rtl"],.ar{font-family:var(--f-ar)}
:focus-visible{outline:2px solid var(--horizon);outline-offset:2px;border-radius:6px}
[tabindex="-1"]:focus{outline:none}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
.mute{color:var(--mute)} .faint{color:var(--faint)} .small{font-size:13px} .xs{font-size:12px} .b{font-weight:600} .bb{font-weight:700}
.red{color:var(--red-f)} .teal{color:var(--teal-f)} .green{color:var(--green-f)} .amber{color:var(--amber-f)} .link{color:var(--link)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px} .row.nowrap{flex-wrap:nowrap} .row.tight{gap:8px} .row.top{align-items:flex-start}
.col{display:flex;flex-direction:column;gap:12px} .col.tight{gap:6px} .col.loose{gap:20px}
.grow{flex:1;min-width:0} .sp{flex:1}
.g2,.g3,.g4,.g5{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.g5{grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}
.g2>*,.g3>*,.g4>*,.g5>*,.col>*{min-width:0}
.hr{height:1px;background:var(--line);border:0;margin:0}
.ic{flex:0 0 auto;display:inline-block;vertical-align:middle}
.logo{display:block;height:28px;width:auto;color:var(--logo-ink)}
.logo.on-nav{color:#FFFFFF}

/* ---------- Shell ---------- */
.app{display:flex;min-height:100vh}
.nav{border-inline-end:1px solid var(--nav-bd);position:sticky;top:0;height:100vh;flex:0 0 252px;width:252px;background:linear-gradient(180deg,var(--nav2) 0%,var(--nav) 38%);display:flex;flex-direction:column;gap:2px;padding:18px 12px 14px;overflow-y:auto;z-index:20;transition:flex-basis var(--d3) var(--ease),width var(--d3) var(--ease);scrollbar-width:none}
.nav .brand{display:flex;align-items:center;gap:10px;margin:2px 8px 18px;border-radius:8px;text-decoration:none}
.nav .client{display:flex;align-items:center;gap:10px;min-height:54px;padding:0 12px;margin-bottom:14px;border-radius:var(--r-m);border:1px solid var(--nav-line);background:rgba(255,255,255,.05);color:#FFFFFF;text-align:start;width:100%;transition:background var(--d1)}
.nav button.client{cursor:pointer}
.nav button.client:hover{background:rgba(255,255,255,.1)}
.nav .client .lg{width:32px;height:32px;flex:0 0 32px;border-radius:9px;background:#FFFFFF;color:#202253;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:var(--f-display)}
.nav .client .t1{display:block;font-size:13px;font-weight:600}
.nav .client .t2{display:block;font-size:11px;color:rgba(255,255,255,.62);margin-top:1px}
.nav .grp{font-size:10.5px;font-weight:700;letter-spacing:.08em;color:rgba(255,255,255,.45);padding:16px 12px 6px;text-transform:uppercase}
.nav .item{position:relative;display:flex;align-items:center;gap:12px;min-height:42px;padding:0 12px;border-radius:10px;text-decoration:none;font-size:14px;font-weight:500;color:var(--nav-t);transition:background var(--d1) var(--ease),color var(--d1)}
.nav .item:hover{background:var(--nav-h);color:#FFFFFF}
.nav .item:active{transform:scale(.985)}
.nav .item[aria-current="page"]{background:var(--nav-a);color:#FFFFFF;font-weight:600}
.nav .item[aria-current="page"]::before{content:"";position:absolute;inset-inline-start:-12px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--aqua)}
.nav .item .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--red);color:#FFFFFF;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.nav .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:12px}
.nav .vina-live{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-m);background:rgba(110,190,185,.1);color:rgba(255,255,255,.85);font-size:12px}
.nav .vina-live b{color:#FFFFFF;font-weight:600}
.nav .collapse{display:flex;align-items:center;gap:10px;min-height:38px;padding:0 12px;border:0;border-radius:10px;background:transparent;color:var(--nav-t);cursor:pointer;font-size:13px}
.nav .collapse:hover{background:var(--nav-h);color:#FFFFFF}
.app.rail .nav{flex-basis:76px;width:76px;padding-inline:10px}
.app.rail .nav .brand .logo{height:20px}
.app.rail .nav .grp{font-size:0;padding:8px 0 4px;margin-top:6px;border-top:1px solid var(--nav-line)}
.app.rail .nav .item{justify-content:center;padding:0}
.app.rail .nav .item::before{inset-inline-start:-10px}
.app.rail .nav .item .lbl,.app.rail .nav .client .txt,.app.rail .nav .client>.ic,.app.rail .nav .vina-live .txt,.app.rail .nav .collapse .lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.app.rail .nav .item .badge{position:absolute;top:3px;right:5px;min-width:16px;height:16px;font-size:10px;padding:0 4px}
.app.rail .nav .client,.app.rail .nav .vina-live,.app.rail .nav .collapse{justify-content:center;padding:0}
.main{flex:1 1 640px;min-width:0;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:12px;min-height:68px;padding:12px 32px;background:color-mix(in srgb,var(--card) 86%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
header.top .ttl{display:flex;flex-direction:column;min-width:0}
header.top h1{font-size:20px;line-height:26px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .crumb{font-size:12px;color:var(--mute);text-decoration:none;display:inline-flex;align-items:center;gap:2px;font-weight:500}
header.top .crumb:hover{color:var(--link)}
header.top .cmdk{display:flex;align-items:center;gap:10px;height:40px;width:300px;padding:0 10px 0 12px;border-radius:10px;border:1px solid var(--line);background:var(--sub);color:var(--mute);cursor:pointer;font-size:13px;transition:border-color var(--d1),background var(--d1)}
header.top .cmdk:hover{border-color:var(--line2);background:var(--card)}
header.top .cmdk kbd,.kbd{margin-inline-start:auto;font:600 11px var(--f);padding:2px 6px;border-radius:6px;border:1px solid var(--line2);background:var(--card);color:var(--mute)}
.ibtn.menu-btn{display:none}
.profile{display:flex;align-items:center;gap:8px;padding:3px 10px 3px 3px;min-height:40px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;transition:border-color var(--d1),box-shadow var(--d1)}
.profile:hover{border-color:var(--line2);box-shadow:var(--e1)}
.profile .pn{font-size:13px;font-weight:600;max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page{padding:28px 32px 56px;display:flex;flex-direction:column;gap:22px;min-width:0;width:100%;max-width:1600px;margin-inline:auto}
.page.flush{padding:0;gap:0;flex:1;min-height:0;max-width:none}
.lead-in{font-size:14px;color:var(--mute);max-width:72ch}
.vo{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sub);color:var(--mute)}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.fresh{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mute)}
.fresh button{border:0;background:transparent;color:var(--mute);width:28px;height:28px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.fresh button:hover{background:var(--sub);color:var(--text)}
.offline{display:flex;align-items:center;gap:10px;padding:9px 32px;background:var(--text);color:var(--bg);font-size:13px;font-weight:500}

/* Verdict + section heads */
.verdict{font-family:var(--f-display);font-size:24px;line-height:32px;font-weight:600;letter-spacing:-.015em;max-width:60ch;text-wrap:balance}
.verdict em{font-style:normal;color:var(--teal-f)}
.verdict strong{color:var(--amber-f);font-weight:700}
.sec-h{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 16px}
.sec-h h2{font-size:16px;font-weight:700}
.sec-h .sub{font-size:13px;color:var(--mute);margin-top:2px}

/* Status chips (LD5) */
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:7px;font-size:12px;font-weight:600;white-space:nowrap;line-height:1}
.chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.c-blue{background:var(--blue-b);color:var(--blue-f)} .c-teal{background:var(--teal-b);color:var(--teal-f)} .c-amber{background:var(--amber-b);color:var(--amber-f)}
.c-navy{background:var(--navy-b);color:var(--navy-f)} .c-purple{background:var(--purple-b);color:var(--purple-f)} .c-indigo{background:var(--indigo-b);color:var(--indigo-f)}
.c-green{background:var(--green-b);color:var(--green-f)} .c-grey{background:var(--grey-b);color:var(--grey-f)} .c-red{background:var(--red-b);color:var(--red-f)}
.vtag{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:6px;font-size:11px;font-weight:700;background:var(--teal-b);color:var(--teal-f);letter-spacing:.02em}
.pulse{position:relative;display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--amber);flex:0 0 8px}
.pulse.red{background:var(--red)} .pulse.green{background:var(--green)} .pulse.teal{background:var(--aqua)}
.pulse::after{content:"";position:absolute;inset:0;border-radius:50%;background:inherit;animation:pulse 1.8s var(--ease) infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.6}80%,100%{transform:scale(2.8);opacity:0}}

/* Buttons */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line2);background:var(--card);color:var(--text);font-size:13px;font-weight:600;text-decoration:none;cursor:pointer;white-space:nowrap;transition:background var(--d1) var(--ease),border-color var(--d1),box-shadow var(--d1),transform var(--d1) var(--ease),color var(--d1)}
.btn:hover{background:var(--sub);border-color:var(--mute)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--on-pri);box-shadow:0 1px 2px rgba(22,26,61,.18),inset 0 1px 0 rgba(255,255,255,.08)}
.btn.pri:hover{background:var(--pri-h);border-color:var(--pri-h);box-shadow:0 6px 16px -6px var(--pri)}
.btn.teal{background:var(--aqua);border-color:var(--aqua);color:#0D2B29}
.btn.danger{background:var(--red);border-color:var(--red);color:#FFFFFF}
.btn.danger-o{color:var(--red-f);border-color:var(--line2)}
.btn.danger-o:hover{background:var(--red-b);border-color:var(--red-f)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--link)}
.btn.ghost:hover{background:var(--sel)}
.btn.sm{min-height:32px;padding:0 12px;font-size:12px;border-radius:8px}
.btn.lg{min-height:48px;padding:0 22px;font-size:15px;border-radius:12px}
.btn.wide{width:100%}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.48;cursor:not-allowed;transform:none;box-shadow:none}
.spin{display:inline-block;flex:0 0 auto;width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ibtn{position:relative;width:40px;height:40px;flex:0 0 40px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background var(--d1),border-color var(--d1),transform var(--d1)}
.ibtn:hover{background:var(--sub);border-color:var(--line2)}
.ibtn:active{transform:scale(.94)}
.ibtn.sm{width:32px;height:32px;flex-basis:32px;border-radius:8px}
.ibtn.bare{border-color:transparent;background:transparent}
.ibtn.bare:hover{background:var(--sub)}
.ibtn .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--card)}
.ibtn .cnt{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--red);color:#FFF;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--card)}
.ring-once .ic{animation:ring .9s var(--ease) 1;transform-origin:50% 10%}
@keyframes ring{0%,100%{transform:rotate(0)}15%{transform:rotate(14deg)}30%{transform:rotate(-12deg)}45%{transform:rotate(8deg)}60%{transform:rotate(-5deg)}75%{transform:rotate(2deg)}}

/* Segmented + tabs */
.seg{display:inline-flex;padding:3px;gap:2px;border-radius:11px;background:var(--sub)}
.seg button,.seg a{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 12px;border-radius:8px;border:0;background:transparent;color:var(--mute);font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;transition:background var(--d2) var(--ease),color var(--d1),box-shadow var(--d2)}
.seg button:hover,.seg a:hover{color:var(--text)}
.seg [aria-pressed="true"],.seg [aria-current="page"],.seg [aria-selected="true"]{background:var(--card);color:var(--text);box-shadow:var(--e1),0 0 0 1px var(--line)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs .tab{position:relative;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border:0;background:transparent;color:var(--mute);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none}
.tabs .tab::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;border-radius:2px;background:var(--pri);transform:scaleX(0);transition:transform var(--d2) var(--ease)}
.tabs .tab:hover{color:var(--text)}
.tabs .tab[aria-selected="true"]{color:var(--text)}
.tabs .tab[aria-selected="true"]::after{transform:scaleX(1)}
.tabs .tab .n{min-width:22px;height:20px;padding:0 6px;border-radius:999px;background:var(--sub);color:var(--mute);font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;transition:background var(--d2),color var(--d2)}
.tabs .tab[aria-selected="true"] .n{background:var(--pri);color:var(--on-pri)}
.fchips{display:flex;flex-wrap:wrap;gap:8px}
.fchip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);background:var(--card);color:var(--text);font-size:13px;font-weight:500;cursor:pointer;transition:background var(--d1),border-color var(--d1),transform var(--d1)}
.fchip:hover{background:var(--sub)}
.fchip:active{transform:scale(.97)}
.fchip[aria-pressed="true"]{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.fchip .n{font-weight:700;opacity:.8}
.fchip .x{margin-inline-start:2px;opacity:.7}

/* Cards */
.card{background:var(--card);border:1px solid var(--card-bd);border-radius:var(--r-l);padding:22px;min-width:0;box-shadow:var(--e1),var(--card-hi)}
.card.pad0{padding:0}
.card.soft,.card.flat{background:var(--sub);border-color:transparent;box-shadow:none}
.card.lift,.lift{transition:transform var(--d2) var(--ease),box-shadow var(--d2) var(--ease)}
.card.lift:hover,.lift:hover{transform:translateY(-2px);box-shadow:var(--e2)}
.card-h{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:16px}
.card-h h2,.h2{font-family:var(--f-display);font-size:15px;line-height:22px;font-weight:700}
.card-h .sub,.h-sub{font-size:13px;color:var(--mute)}
.h3{font-size:13px;font-weight:600}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
.kpi{position:relative;background:var(--card);border:1px solid var(--card-bd);border-radius:var(--r-l);padding:18px 20px;display:flex;flex-direction:column;gap:6px;min-width:0;box-shadow:var(--e1)}
.kpi .k{font-size:13px;color:var(--mute);font-weight:500}
.kpi .v{font-family:var(--f-display);font-size:30px;line-height:36px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .d{display:inline-flex;align-items:center;gap:3px;height:22px;padding:0 7px;border-radius:6px;font-size:12px;font-weight:600}
.kpi .n{font-size:12px;color:var(--mute)}
.kpi.hero{padding:22px 24px}
.kpi.hero .v{font-size:40px;line-height:46px}
.kpi.hot{background:linear-gradient(180deg,var(--amber-b),var(--card) 140%);box-shadow:var(--e1),inset 0 0 0 1px color-mix(in srgb,var(--amber-f) 30%,transparent)}
.kpi.mini{padding:14px 16px;box-shadow:none;background:var(--sub);border-color:transparent}
.kpi.mini .v{font-size:22px;line-height:28px}
.spark{display:block;width:100%;height:34px;margin-top:4px}
.kv{display:grid;grid-template-columns:minmax(110px,40%) 1fr;gap:9px 12px;font-size:13px}
.kv dt{color:var(--mute)} .kv dd{margin:0;font-weight:500;min-width:0;overflow-wrap:anywhere}
.list{display:flex;flex-direction:column}
.list>.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list>.li:last-child{border-bottom:0}

/* Tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--card-bd);border-radius:var(--r-l);background:var(--card);box-shadow:var(--e1)}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.tbl th{position:sticky;top:0;z-index:1;text-align:start;font-size:11.5px;font-weight:600;letter-spacing:.02em;color:var(--mute);padding:0 14px;height:42px;background:var(--card);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px;border-radius:4px;min-height:32px}
.tbl th button:hover{color:var(--text)}
.tbl th button:focus-visible{outline:2px solid var(--horizon)}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{transition:background var(--d1)}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover{background:var(--sub)}
.tbl tbody tr.sel{background:var(--sel)}
.tbl tbody tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--horizon)}
.tbl .r{text-align:end}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.ell2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* Avatars + channel icons */
.av{width:34px;height:34px;flex:0 0 34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;letter-spacing:.01em;font-family:var(--f-display)}
.av.sm{width:26px;height:26px;flex-basis:26px;font-size:10px}
.av.lg{width:48px;height:48px;flex-basis:48px;font-size:16px}
.av.xl{width:64px;height:64px;flex-basis:64px;font-size:22px}
.av.vina{background:linear-gradient(135deg,var(--horizon),var(--aqua));color:#FFFFFF;box-shadow:0 2px 8px -2px rgba(94,151,206,.6)}
.avw{position:relative;display:inline-flex}
.avw .pres,.pres-dot{position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;border:2px solid var(--card)}
.pres.available{background:var(--green)} .pres.busy{background:var(--amber)} .pres.away{background:var(--faint)}
.chi{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;flex:0 0 26px;border-radius:8px}
.chi.lg{width:40px;height:40px;flex-basis:40px;border-radius:11px}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who .nm{font-weight:600;min-width:0}
.unread-dot{width:8px;height:8px;border-radius:50%;background:var(--horizon);flex:0 0 8px;box-shadow:0 0 0 3px var(--blue-b)}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lbl{font-size:13px;font-weight:600}
.field .hint{font-size:12px;color:var(--mute)}
.field .err,.err{font-size:12px;color:var(--red-f);display:flex;gap:6px;align-items:flex-start;animation:shake .32s var(--ease) 1}
@keyframes shake{20%{transform:translateX(-3px)}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}80%{transform:translateX(1px)}}
.inp{width:100%;min-height:42px;padding:0 12px;border-radius:10px;border:1px solid var(--line2);background:var(--inp);color:var(--text);font-size:14px;outline:0;transition:border-color var(--d1),box-shadow var(--d2) var(--ease)}
.inp::placeholder{color:var(--faint)}
.inp:hover{border-color:var(--mute)}
.inp:focus{border-color:var(--horizon);box-shadow:0 0 0 4px var(--ring)}
.inp.bad{border-color:var(--red-f)}
.inp.bad:focus{box-shadow:0 0 0 4px rgba(217,45,32,.18)}
textarea.inp{padding:10px 12px;min-height:84px;resize:vertical;line-height:1.5}
select.inp{appearance:none;padding-inline-end:34px;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;cursor:pointer}
.inp-g{position:relative;display:flex;align-items:center}
.inp-g .inp{padding-inline-end:44px}
.inp-g .ibtn{position:absolute;inset-inline-end:4px;width:34px;height:34px;flex-basis:34px;border:0;background:transparent}
.chk{display:flex;align-items:flex-start;gap:10px;font-size:14px;cursor:pointer;min-height:28px;padding:4px 0}
.chk input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--pri);flex:0 0 18px;cursor:pointer}
.radio-card{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-radius:var(--r-m);border:1px solid var(--line2);background:var(--card);cursor:pointer;text-align:start;width:100%;transition:border-color var(--d1),box-shadow var(--d2) var(--ease),background var(--d1),transform var(--d1)}
.radio-card:hover{border-color:var(--mute)}
.radio-card:active{transform:scale(.99)}
.radio-card[aria-pressed="true"],.radio-card[aria-checked="true"],.radio-card.on{border-color:var(--pri);box-shadow:0 0 0 1px var(--pri),0 6px 16px -8px var(--pri);background:var(--sel)}
.switch{position:relative;width:42px;height:24px;flex:0 0 42px;border-radius:999px;border:0;background:var(--line2);cursor:pointer;padding:0;transition:background var(--d2) var(--ease)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left var(--d3) var(--spring),width var(--d1)}
.switch:active::after{width:24px}
.switch[aria-checked="true"]{background:var(--pri)}
.switch[aria-checked="true"]::after{left:20px}
.switch[aria-checked="true"]:active::after{left:16px}
.switch[disabled]{opacity:.5;cursor:not-allowed}
.sw-row{display:flex;align-items:center;gap:12px;min-height:44px}
.otp{display:flex;gap:8px}
.otp input{width:52px;min-width:0;flex:0 1 52px;height:60px;text-align:center;font-size:24px;font-weight:700;border-radius:12px;font-family:var(--f-display)}
.tokens{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px;min-height:42px;border:1px solid var(--line2);border-radius:10px;background:var(--inp)}
.tokens .tok{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 4px 0 10px;border-radius:7px;background:var(--sub);font-size:13px;font-weight:500}
.tokens .tok button{border:0;background:transparent;width:28px;height:28px;border-radius:6px;cursor:pointer;color:var(--mute);display:inline-flex;align-items:center;justify-content:center}
.tokens .tok button:hover{background:var(--sub2);color:var(--text)}
.tokens input{flex:1;min-width:120px;border:0;outline:0;background:transparent;height:28px}
.blank{display:inline-flex;align-items:center;padding:0 5px;border-radius:5px;background:var(--blue-b);color:var(--blue-f);font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.92em}

/* Notes + banners */
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-m);font-size:13px;background:var(--sub);color:var(--text)}
.note .ic{margin-top:1px}
.note.info{background:var(--blue-b);color:var(--blue-f)}
.note.ok{background:var(--green-b);color:var(--green-f)}
.note.warn{background:var(--amber-b);color:var(--amber-f)}
.note.err{background:var(--red-b);color:var(--red-f)}
.note.vina{background:var(--teal-b);color:var(--teal-f)}
.note b{font-weight:700}
.note a{color:inherit;font-weight:600}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:10px 32px;background:var(--red);color:#FFFFFF;font-size:14px;font-weight:500}
.banner .btn{min-height:32px;background:#FFFFFF;color:#B42318;border-color:#FFFFFF}
.pausebar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--amber-b);color:var(--amber-f);font-size:13px;font-weight:600}

/* Empty, loading, error */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:52px 24px;color:var(--mute)}
.empty .art{width:72px;height:72px;border-radius:22px;background:radial-gradient(circle at 30% 25%,var(--card),var(--sub) 70%);color:var(--horizon);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px var(--line),var(--e1)}
.empty h3{font-size:16px;font-weight:700;color:var(--text)}
.empty p{max-width:46ch;font-size:13px}
.skel{border-radius:10px;background:linear-gradient(90deg,var(--sub) 0%,var(--sub2) 50%,var(--sub) 100%);background-size:200% 100%;animation:sk 1.3s ease-in-out infinite}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* Chat */
.chat{display:flex;flex-direction:column;gap:10px;padding:20px;overflow-y:auto;background:radial-gradient(1200px 400px at 50% -10%,var(--sub),transparent)}
.msg{max-width:min(78%,540px);display:flex;flex-direction:column;gap:4px}
.msg .bub{padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.5;overflow-wrap:anywhere;box-shadow:var(--e1)}
.msg .meta{font-size:11px;color:var(--mute);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.msg.in{align-self:flex-start}
.msg.in .bub{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.vina{align-self:flex-end;align-items:flex-end}
.msg.vina .bub{background:var(--teal-b);color:var(--text);border-bottom-right-radius:5px;box-shadow:none}
.msg.agent{align-self:flex-end;align-items:flex-end}
.msg.agent .bub{background:var(--pri);color:var(--on-pri);border-bottom-right-radius:5px}
.msg.note .bub{background:var(--amber-b);color:var(--text);border:1px dashed var(--amber-f);box-shadow:none}
.msg .src{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--teal-f);text-decoration:underline dotted;cursor:help}
.evt{align-self:center;display:inline-flex;align-items:center;gap:8px;max-width:92%;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:500;background:var(--sub);color:var(--mute);text-align:center}
.evt.teal{background:var(--teal-b);color:var(--teal-f)} .evt.amber{background:var(--amber-b);color:var(--amber-f)} .evt.blue{background:var(--blue-b);color:var(--blue-f)}
.actcard{align-self:flex-end;width:min(100%,380px);border:1px solid color-mix(in srgb,var(--teal-f) 40%,transparent);background:var(--card);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:13px;box-shadow:var(--e1)}
.actcard .ah{display:flex;align-items:center;gap:8px;font-weight:600}
.actcard .ah .st{margin-inline-start:auto}
.actcard ul{margin:0;padding-inline-start:18px;color:var(--mute)}
.actcard.fail{border-color:var(--red-f)}
.typing{align-self:flex-end;display:inline-flex;gap:4px;padding:12px 14px;border-radius:16px;background:var(--teal-b);animation:rise var(--d2) var(--ease)}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--teal-f);animation:ty 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes ty{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.msg.anim-in,.evt.anim-in,.actcard.anim-in{animation:msgIn var(--d3) var(--spring) both}
@keyframes msgIn{from{opacity:0;transform:translateY(10px) scale(.98)}}

/* Status stepper */
.steps{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.steps .st{display:flex;flex-direction:column;gap:6px;font-size:12px;min-width:0}
.steps .st .bar{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.steps .st.done .bar,.steps .st.cur .bar{background:var(--indigo-f)}
.steps .st.cur{font-weight:700}
.steps .st .d{color:var(--mute);font-weight:400}

/* Overlays (entry animation only on first appearance: .anim-in; exit runs on a ghost copy: .out) */
.scrim{position:fixed;inset:0;z-index:60;background:var(--dim);display:flex;align-items:center;justify-content:center;padding:24px 16px;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.scrim.anim-in{animation:fade var(--d2) var(--ease)}
.modal{width:min(560px,100%);max-height:calc(100vh - 48px);overflow:auto;background:var(--card);border-radius:var(--r-xl);box-shadow:var(--e3);display:flex;flex-direction:column;border:1px solid var(--card-bd)}
.scrim.anim-in .modal{animation:pop var(--d3) var(--spring)}
.modal.wide{width:min(760px,100%)} .modal.narrow{width:min(440px,100%)}
.modal .mh{display:flex;align-items:flex-start;gap:12px;padding:22px 24px 0}
.modal .mh h2{font-size:18px;font-weight:700;flex:1}
.modal .mh p{font-size:13px;color:var(--mute);margin-top:4px}
.modal .mb{padding:18px 24px;display:flex;flex-direction:column;gap:16px}
.modal .mf{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;padding:16px 24px 20px;border-top:1px solid var(--line);background:var(--sub);border-radius:0 0 var(--r-xl) var(--r-xl)}
.drawer-scrim{position:fixed;inset:0;z-index:55;background:var(--dim)}
.drawer-scrim.anim-in{animation:fade var(--d2)}
.drawer{position:fixed;top:0;bottom:0;right:0;z-index:56;width:min(460px,100%);background:var(--card);border-left:1px solid var(--line);box-shadow:var(--e3);display:flex;flex-direction:column}
.drawer.anim-in{animation:slide var(--d3) var(--ease)}
.drawer .dh{display:flex;align-items:flex-start;gap:12px;padding:20px 22px;border-bottom:1px solid var(--line)}
.drawer .db{flex:1;overflow-y:auto;padding:20px 22px;display:flex;flex-direction:column;gap:16px}
.drawer .df{display:flex;flex-wrap:wrap;gap:8px;padding:14px 22px;border-top:1px solid var(--line);background:var(--sub)}
.ghost{pointer-events:none}
.ghost.scrim,.ghost.drawer-scrim{animation:fadeOut 160ms var(--ease-in) forwards}
.ghost.scrim .modal{animation:popOut 160ms var(--ease-in) forwards}
.ghost.drawer{animation:slideOut 200ms var(--ease-in) forwards}
.menu{position:absolute;z-index:40;min-width:220px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--e3);padding:6px;display:flex;flex-direction:column;transform-origin:top right}
.menu.anim-in{animation:menuIn var(--d2) var(--ease)}
.menu button,.menu a{display:flex;align-items:center;gap:10px;min-height:38px;padding:0 10px;border:0;background:transparent;border-radius:8px;text-align:start;cursor:pointer;color:var(--text);text-decoration:none;font-size:13px;transition:background var(--d1)}
.menu button:hover,.menu a:hover{background:var(--sub)}
.menu .mh{padding:8px 10px 6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.pops{position:fixed;top:16px;right:16px;z-index:70;display:flex;flex-direction:column;gap:10px;width:min(380px,calc(100vw - 32px))}
.pop{background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--e3);padding:14px 16px;display:flex;gap:12px}
.pop.anim-in{animation:popIn var(--d3) var(--spring)}
.pop .pt{font-size:13px;font-weight:700}
.pop .pb{font-size:13px;color:var(--mute);margin-top:2px}
.pop.teal{box-shadow:var(--e3),inset 3px 0 0 var(--aqua)} .pop.amber{box-shadow:var(--e3),inset 3px 0 0 var(--amber)} .pop.red{box-shadow:var(--e3),inset 3px 0 0 var(--red)}
.toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:calc(100vw - 32px)}
.toast{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;padding:11px 12px 11px 16px;border-radius:12px;background:#161A3D;color:#FFFFFF;font-size:13px;font-weight:500;box-shadow:var(--e3)}
.toast.anim-in{animation:toastIn var(--d3) var(--spring)}
.toast .ic{color:var(--aqua)}

.auth .side{position:relative;overflow:hidden;background:radial-gradient(900px 500px at 10% 0%,#2D3290 0%,transparent 60%),radial-gradient(700px 500px at 100% 100%,rgba(110,190,185,.35) 0%,transparent 55%),#1D1F4E;color:#FFFFFF;padding:48px;display:flex;flex-direction:column;gap:24px}

/* Page entry choreography: only on route change (.enter is set once per navigation) */

.page.enter>*:nth-child(2){animation-delay:40ms} .page.enter>*:nth-child(3){animation-delay:80ms} .page.enter>*:nth-child(4){animation-delay:120ms}

/* Focus: a soft ring that follows the control's radius */

/* Buttons and nav: small, honest feedback */
.btn.pri:hover{transform:translateY(-1px)} .btn.pri:active{transform:translateY(0) scale(.97)}

/* Sliding selection indicators (.seg pill, .tabs underline): core moves one element from the old choice to the new one */
.seg,.tabs{position:relative}
.seg>*,.tabs>*{position:relative;z-index:1}
.seg>.ind,.tabs>.ind{position:absolute;z-index:0;pointer-events:none;left:0;top:0;transition:transform var(--d3) var(--spring),width var(--d3) var(--spring),height var(--d3) var(--spring)}

.page.enter .g2>*:nth-child(3),.page.enter .g3>*:nth-child(3),.page.enter .g4>*:nth-child(3),.page.enter .g5>*:nth-child(3){animation-delay:110ms}

.cx-rm{display:flex;align-items:center;gap:8px;margin-top:5px;min-width:0;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden}
.cx-rm .chip{height:22px;padding:0 8px;font-size:12px;border-radius:6px;flex:0 0 auto}
.cx-rm .stars .ic{width:11px;height:11px}
.cx-head{container-type:inline-size;position:relative;display:flex;align-items:center;gap:10px;min-height:64px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.cx-head .btn{flex:0 0 auto}
.cx-hn{flex:1;min-width:0}
.cx-hn .b{font-size:15px}
.cx-back{display:none}
.cx-dpb[aria-pressed="true"]{background:var(--sel);border-color:color-mix(in srgb,var(--horizon) 45%,transparent);color:var(--link)}
/* Thread: grouped bubbles, day lines, quiet events */
.cx-tw{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.chat.cx-thr{flex:1;min-height:0;gap:0;padding:8px 24px 24px}
.cx-day{display:flex;align-items:center;gap:12px;margin:20px 0 4px;font-size:12px;font-weight:600;color:var(--mute);white-space:nowrap}
.cx-day::before,.cx-day::after{content:"";flex:1;height:1px;background:var(--line)}
.cx-g{display:flex;gap:10px;align-items:flex-start;margin-top:14px;max-width:min(78%,600px)}
.cx-g.in{align-self:flex-start}
.cx-g:not(.in){align-self:flex-end;flex-direction:row-reverse}
.cx-gav{flex:0 0 auto;margin-top:2px}
.cx-gb{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0}
.cx-g:not(.in) .cx-gb{align-items:flex-end}
.cx-gh{display:flex;align-items:center;gap:6px;margin-bottom:2px;font-size:12px;color:var(--mute);white-space:nowrap}
.cx-gh b{color:var(--text);font-weight:600}
.cx-g.note .cx-gh{color:var(--amber-f)}
.cx-m{display:flex;flex-direction:column;align-items:inherit;gap:4px;max-width:100%}
.cx-m .bub{max-width:100%;padding:8px 12px;border-radius:14px;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.cx-g.in .bub{background:var(--card);border:1px solid var(--line);box-shadow:var(--e1)}
.cx-g.vina .bub{background:var(--teal-b);color:var(--text)}
.cx-g.agent .bub{background:var(--pri);color:var(--on-pri)}
.cx-g.note .bub{background:var(--amber-b);color:var(--text);border:1px dashed color-mix(in srgb,var(--amber-f) 55%,transparent)}
.cx-g.in .cx-gh+.cx-m .bub{border-top-left-radius:4px}
.cx-g:not(.in) .cx-gh+.cx-m .bub{border-top-right-radius:4px}
.cx-src{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;border:1px solid color-mix(in srgb,var(--teal-f) 30%,transparent);color:var(--teal-f);font-size:12px;font-weight:600;cursor:help}
.cx-src:focus-visible{outline:2px solid var(--horizon);outline-offset:2px}
.cx-tick{display:inline-flex;color:var(--faint)} .cx-tick.read{color:var(--horizon)}
.cx-tplh{display:flex;align-items:center;gap:5px;margin-bottom:3px;font-size:12px;font-weight:700;opacity:.8}
.cx-file{display:inline-flex;align-items:center;gap:8px}
.cx-ev{align-self:center;max-width:86%;margin-top:12px;font-size:12px;line-height:18px;color:var(--mute);text-align:center;text-wrap:balance}
.cx-ev .ic{display:inline-block;vertical-align:-2px;margin-inline-end:6px;color:var(--faint)}
.cx-ev.teal .ic{color:var(--teal-f)} .cx-ev.amber .ic{color:var(--amber-f)} .cx-ev.blue .ic{color:var(--blue-f)}
.cx-ev .tm{color:var(--faint);white-space:nowrap}
.cx-evs{display:flex;flex-direction:column;align-items:center}
.cx-evs.anim-open .cx-ev{animation:rise var(--d3) var(--ease) both;animation-delay:calc(var(--i) * 40ms)}
.cx-more{align-self:center;display:inline-flex;align-items:center;gap:6px;min-height:28px;margin-top:12px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--mute);font-size:12px;cursor:pointer;transition:background var(--d1),border-color var(--d1)}
.cx-more:hover{background:var(--sub);border-color:var(--line2)}
.cx-more u{text-decoration:none;color:var(--link);font-weight:600}
.cx-thr .actcard{margin-top:14px}
.cx-m.anim-in,.cx-ev.anim-in,.cx-more.anim-in,.cx-thr .actcard.anim-in{animation:msgIn var(--d3) var(--spring) both}
.cx-typing{align-self:flex-start;background:var(--card);border:1px solid var(--line)}
.cx-typing i{background:var(--mute)}
.cx-jump{position:absolute;left:50%;bottom:14px;z-index:2;display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:12px;font-weight:600;box-shadow:var(--e2);cursor:pointer;opacity:0;pointer-events:none;transform:translate(-50%,8px);transition:opacity var(--d2) var(--ease),transform var(--d2) var(--ease)}
.cx-jump.on{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.cx-ro{display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:var(--card);font-size:13px;color:var(--mute)}
/* Details panel */
.cx-dp{display:flex;flex-direction:column;gap:16px;min-width:0;min-height:0;overflow-y:auto;padding:18px 18px 72px;background:var(--card);border-inline-start:1px solid var(--line)}
.cx-dp.anim-in{animation:slide var(--d3) var(--ease)}
.cx-dph{display:flex;align-items:center;gap:12px}
.cx-dpn{font-family:var(--f-display);font-size:16px;font-weight:700}
.cx-dpx{display:none}
.cx-sum{background:var(--teal-b);border-radius:var(--r-m);padding:12px 14px;font-size:13px;line-height:1.5}
.cx-sum .hd{display:flex;align-items:center;gap:6px;margin-bottom:4px;color:var(--teal-f);font-size:12px;font-weight:700;letter-spacing:.02em}
.cx-sum .kv{grid-template-columns:auto 1fr;gap:6px 12px;margin-top:10px;padding-top:10px;border-top:1px solid color-mix(in srgb,var(--teal-f) 22%,transparent)}
.cx-sec{display:flex;flex-direction:column;gap:10px;padding-top:14px;border-top:1px solid var(--line)}
.cx-sec h3{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
.cx-sec .kv{grid-template-columns:minmax(96px,38%) 1fr;gap:7px 12px}
.cx-dpmore{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:28px;padding:0;border:0;background:transparent;color:var(--mute);font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;cursor:pointer}
.cx-dpmore:hover{color:var(--text)}
.cx-dpmore[aria-expanded="true"] .ic{transform:rotate(180deg)}
.cx-dpg.anim-in{animation:rise var(--d3) var(--ease)}
@media (max-width:1279px){
  .cx-dp{position:absolute;top:0;right:0;bottom:0;z-index:6;width:min(340px,100%);border:0;box-shadow:var(--e3)}
  .cx-dpx{display:inline-flex}
}
@container (max-width:620px){.cx-hchip{display:none}}
@media (max-width:760px){
  .cx-back{display:inline-flex}
  .cx-head{padding:8px 12px;gap:8px}
  .chat.cx-thr{padding:4px 14px 20px}
  .cx-g{max-width:88%}
  .cx-search input{font-size:16px}
}

/* ================= Analytics layout (GA-style): flat cards with hairline borders, one report card pattern ================= */
:root{--card-bd:var(--line)}
.card,.kpi,.tbl-wrap{box-shadow:none;border:1px solid var(--card-bd);border-radius:12px}
.card.soft,.card.flat,.kpi.mini{border-color:transparent}
.card.lift:hover,.lift:hover{box-shadow:0 4px 14px -6px rgba(22,26,61,.18)}
.page{gap:20px}
/* Report card: title row, body, footer link to the full report */
.rc{display:flex;flex-direction:column;padding:0;min-width:0}
.rc-h{display:flex;align-items:flex-start;gap:12px;padding:18px 20px 6px}
.rc-h h2{font-family:var(--f);font-size:14px;font-weight:600;line-height:20px;letter-spacing:0}
.rc-h .sub{font-size:12.5px;color:var(--mute);margin-top:2px}
.rc-b{padding:10px 20px 18px;flex:1;min-width:0}
.rc-f{display:flex;justify-content:flex-end;padding:10px 16px;border-top:1px solid var(--line)}
.rc-f a,.rc-f button{display:inline-flex;align-items:center;gap:4px;min-height:32px;padding:0 8px;border:0;border-radius:8px;background:transparent;color:var(--link);font-size:13px;font-weight:600;text-decoration:none;cursor:pointer}
.rc-f a:hover,.rc-f button:hover{background:var(--sel)}
/* Page toolbar: filters on the left, date range and page actions on the right (one row, wraps on small screens) */
.ptb{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;min-height:44px}
.ptb .sp{flex:1}
.ptb-date{display:inline-flex;align-items:center;gap:10px;min-height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line2);background:var(--card);cursor:pointer;font-size:13px;color:var(--text)}
.ptb-date .r{color:var(--mute);font-variant-numeric:tabular-nums}
.ptb-date:hover{background:var(--sub)}
.addf{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;border-radius:999px;border:1px dashed var(--line2);background:transparent;color:var(--mute);font-size:13px;font-weight:500;cursor:pointer}
.addf:hover{border-style:solid;color:var(--text);background:var(--sub)}
@media (max-width:760px){.rc-h{padding:14px 16px 4px}.rc-b{padding:8px 16px 14px}}

function diffN(a, b) {
  if (a === b) return 0;
  if (a == null || b == null || typeof a !== 'object' || typeof b !== 'object') return 1;
  if (Array.isArray(a) !== Array.isArray(b)) return 1;
  let n = 0; const ks = new Set([...Object.keys(a), ...Object.keys(b)]);
  ks.forEach(k => { n += diffN(a[k], b[k]); });
  return n;
}

    const i = INV.find(x => x.no === m.no), vat = Math.round(i.base * VAT * 100) / 100;
    if (m.phase === 'done') return modalFrame('Paid', `<div class="cp-paid" role="status"><span class="ok">${ic('check', 28)}</span><b style="font-size:16px">${sar(withVat(i.base))} paid</b><span class="small mute">For ${i.m}. The receipt is sent to ${esc(S.f.cps.email)}.</span></div>`, `<button type="button" class="btn pri" data-a="cp-pay-done">Done</button>`, {size:'narrow'});
    const busy = m.phase === 'paying';
    return modalFrame('Pay ' + i.m, `<div class="tbl-wrap" style="box-shadow:none;background:var(--sub)"><table class="tbl"><tbody><tr><td>Invoice ${i.no}</td><td class="r num">${sar(i.base)}</td></tr><tr><td>VAT 15%</td><td class="r num">${sar(vat)}</td></tr><tr><td><b>To pay</b></td><td class="r num bb">${sar(withVat(i.base))}</td></tr></tbody></table></div>
      <div class="radio-card on" role="radio" aria-checked="true">${ic('card', 20)}<span class="grow"><b>Saved card ending 4417</b><span class="xs mute" style="display:block">Added by Sami Al-Rashid, account admin</span></span>${ic('check', 18)}</div>
      ${busy ? `<div class="note" role="status">${ic('lock', 16)}<span>Paying securely. Do not close this window.</span><span class="sr" data-until="${m.until}" data-done="cp-paid"></span></div>` : ''}`,
      `<button type="button" class="btn" data-a="close-modal" ${busy ? 'disabled' : ''}>Cancel</button><button type="button" class="btn pri" data-a="cp-paying" ${busy ? 'aria-busy="true" disabled' : ''}>${busy ? '<span class="spin" aria-hidden="true"></span>Paying' : 'Pay ' + sar(withVat(i.base))}</button>`, {size:'narrow'});
  };
})();

;
/* Screen index (section 13 checklist) and start-up. Loaded last. */
R('screens', {id:'—', title:'All screens', public:true, render() {
  const areas = [...new Set(SCREENS.map(s => s[2]))];
  const roleOf = r => r ? ROLE_LABEL[r] : 'Signed out';
  return `<div class="full"><div class="full-top">${LOGO()}<b style="font-size:15px">Dashboard · all screens</b><span class="sp"></span><button type="button" class="ibtn" data-a="theme" aria-label="Light or dark">${ic(curTheme() === 'dark' ? 'sun' : 'moon')}</button>${S.role ? `<a class="btn pri" href="#${HOME[S.role]}">Back to my dashboard</a>` : `<a class="btn pri" href="#login">Log in</a>`}</div>
  <div style="width:min(1180px,100%);margin:0 auto;padding:28px max(16px,env(safe-area-inset-right,0px)) 96px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:22px">
    <div class="col tight"><h1 style="font-size:26px;font-weight:700">Every screen in the brief, working</h1><p class="lead-in">49 screens, 24 of them needed for launch. Open one and the prototype signs you in as the person who uses it. Use the Prototype button (bottom left) to switch person, colours, or the empty, loading and error versions of a screen.</p></div>
    ${areas.map(a => `<section class="col tight"><h2 class="h2">${esc(a)}</h2><div class="tbl-wrap"><table class="tbl"><thead><tr><th style="width:70px">ID</th><th>Screen</th><th style="width:150px">Opens as</th><th style="width:110px">Priority</th><th style="width:90px"><span class="sr">Open</span></th></tr></thead><tbody>
      ${SCREENS.filter(s => s[2] === a).map(s => `<tr class="click" data-a="open-screen" data-x="${s[0]}"><td class="b num">${s[0]}</td><td>${esc(s[1])}</td><td class="mute">${roleOf(s[5])}</td><td>${s[3] === 'P1' ? chipC('P1 · Launch', 'teal') : s[3] === 'P2' ? chipC('P2 · Next', 'blue') : chipC('P3 · Later', 'grey')}</td><td class="r"><button type="button" class="btn sm" data-a="open-screen" data-x="${s[0]}">Open${ic('arrowR', 14)}</button></td></tr>`).join('')}
    </tbody></table></div></section>`).join('')}
  </div></div>`;
}});

(function boot() {
  try { const t = localStorage.getItem('vina-theme'); if (t) setTheme(t); S.rail = !!localStorage.getItem('vina-rail'); } catch (e) {}
  S._enter = true; S.offline = !navigator.onLine;
  document.body.insertAdjacentHTML('afterbegin', LOGO_DEFS);
  if (!location.hash) location.hash = 'screens';
  render();
  document.documentElement.dataset.ready = '1'; // later theme changes crossfade
})();

</script>
</body>
